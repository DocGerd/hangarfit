version: 2
updates:
  # The pip ecosystem entry covers pyproject.toml (project deps + the `dev`
  # optional-deps group) and the hash-pinned lockfiles generated by
  # `pip-compile --generate-hashes` (requirements-dev/build/fuzz/pip-tools.txt,
  # plus the requirements-*.in sources backing three of them). Dependabot
  # auto-discovers requirements*.txt files in the configured directory and
  # recognises the pip-compile-autogenerated header, so version bumps
  # regenerate the hashes correctly.
  #
  # Measured, over the repo's entire PR history: every pip PR Dependabot has
  # ever opened named a root declared in one of the three `.in` files
  # (setuptools, wheel, build, pip-tools, atheris). It has opened ZERO PRs for
  # a transitive dep — including transitives such as `packaging` and `click`
  # that live inside lockfiles it provably rewrites — and ZERO against
  # requirements-dev.txt, which is compiled from pyproject.toml rather than from
  # a `.in` file. Snapshot at 2026-08, 51 Dependabot PRs into the repo's life:
  # npm 29, github-actions 15, pip 7. So grouping pip is about attribution and
  # lockfile-conflict avoidance, not volume, and no catch-all group is
  # warranted.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Packaging tooling — never shipped, near-zero CVE surface, and prone to
      # co-editing the SAME lockfiles: #962 (wheel) and #963 (setuptools) both
      # rewrote requirements-build.txt AND requirements-pip-tools.txt in one
      # run. `wheel` and `build` are the members this group will actually
      # collapse.
      #
      # Note `setuptools` is here as future-proofing, not as an active case:
      # both setuptools bumps in repo history were MAJORS (e99c1d4 82->83,
      # 4b26540 83->84), which `update-types` below excludes by design, so that
      # #962/#963 pair would still arrive as two PRs. Upstream setuptools does
      # ship minors and patches (the whole 80.x line), so the pattern is not
      # permanently inert — it simply has not fired here yet.
      #
      # `pip-tools` is deliberately NOT in this group. It is the GENERATOR of
      # the other three lockfiles: all three REQUIRED drift checks (`lockfile
      # drift check`, `build lockfile drift check`, `fuzz lockfile drift
      # check`) install pip-tools from requirements-pip-tools.txt, regenerate,
      # and diff. An ordinary version bump is safe on its own — each guard
      # `cp`s the committed .txt over the pip-compile output path first, and
      # pip-compile treats that as a pin source, so Dependabot's new version is
      # simply carried through (proven by 4b26540, a .txt-only setuptools bump
      # that left requirements-build.in untouched and still went green). The
      # risk is that a pip-tools bump changes the GENERATOR's own output: the
      # .in headers already carry an explicit defence against a pip-tools 8.0
      # `--strip-extras` default flip. Grouped, such a change would redden
      # three required checks with four candidate causes; alone, it is one
      # bisectable PR. That is worth the ~1 extra PR per pip-tools release.
      pip-build-toolchain:
        patterns: ["setuptools", "wheel", "build"]
        update-types: ["minor", "patch"]
      # Test/lint/typecheck tooling plus the standalone fuzz harness.
      # `atheris` is named explicitly rather than caught by
      # `dependency-type: development`, because it lives only in
      # requirements-fuzz.in, outside pyproject.toml's extras.
      #
      # Be aware this group is mostly DORMANT today — stated as an OBSERVATION,
      # since the cause is not established. What is measured: every pip PR
      # Dependabot has opened here named a root declared in a requirements-*.in
      # file, and it has opened none at all against requirements-dev.txt, which
      # is the only route pytest*/ruff/mypy/types-*/hypothesis take into the
      # tree. Do NOT explain that away as "their `>=` floors are already
      # satisfied": Dependabot demonstrably does bump a satisfied floor when it
      # sees one, e.g. 8ab284a rewrote `atheris>=3.0.0` to `>=3.1.0`. `atheris`
      # is simply the only member with an observed source of bumps. The patterns
      # are kept so the group activates on its own if that changes.
      pip-dev-and-fuzz-tooling:
        patterns: ["pytest*", "ruff", "mypy", "types-*", "hypothesis", "atheris"]
        update-types: ["minor", "patch"]
    # Deliberately NOT grouped: pyyaml / shapely / matplotlib — the real
    # [project.dependencies] shipped to users — so a version bump to a
    # geometry/rendering dependency gets its own reviewable PR. Majors are
    # excluded from both groups above for the same reason (setuptools 83->84
    # needed a real wheel-build check CI does not perform).

  # The npm ecosystem entry covers the viewer's dev/CI-only TypeScript
  # toolchain (viewer/package.json + viewer/package-lock.json, ADR-0020).
  # These devDependencies are never published and never shipped in the wheel,
  # but they still need security/version monitoring like any other lockfile.
  - package-ecosystem: npm
    directory: "/viewer"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # viewer/package.json declares no runtime `dependencies` block — all
      # entries are devDependencies — so this covers the whole viewer surface.
      # `exclude-patterns` carves the vendored-three lockstep pins back out.
      # Two gaps make this belt-and-braces rather than a guarantee: it is NOT
      # documented whether the `ignore:` rules below pre-filter a group, and the
      # documented exclude precedence ("if a dependency is matched by both a
      # pattern and an exclude-pattern, it is excluded from the group") is
      # stated for patterns/exclude-patterns, not for a membership set defined
      # by `dependency-type`. Neither alone is a promise; together with the
      # `ignore:` rules they are enough.
      viewer-dev-dependencies:
        dependency-type: "development"
        exclude-patterns: ["three", "@types/three"]
        # Majors stay individual (e.g. typescript 6->7: PR #944, tracked in
        # issue #970).
        update-types: ["minor", "patch"]
    # `three` and `@types/three` are pinned to 0.160.x in lockstep with the
    # vendored three.js r160 (src/hangarfit/_viewer_assets/three/VENDOR.md).
    # The ci.yml skew guard fails if either drifts from the vendored
    # major.minor, so a Dependabot bump would always be un-mergeable. These
    # are bumped by hand via the VENDOR.md vendor-bump process, not here.
    # (The test-only `three` devDep is the same package as `three` above, so
    # the single ignore rule covers it too.) Every other viewer devDep
    # (esbuild, typescript, eslint, @types/node, globals, typescript-eslint,
    # @eslint/js) stays free for Dependabot to update.
    ignore:
      - dependency-name: "three"
      - dependency-name: "@types/three"

  # Workflow-level actions (.github/workflows/*.yml).
  #
  # The catch-all `patterns: ["*"]` with NO `update-types` filter is
  # deliberate, and is the whole point of this entry. `github/codeql-action/init`
  # and `.../analyze` are the same action at the same SHA, but Dependabot models
  # each `uses:` path as an independent dependency. `init` stamps its version
  # into the config it writes and every later codeql-action step strict-compares
  # it (`config.version !== getActionVersion()` -> ConfigurationError), so a
  # split pair fails the REQUIRED `Analyze (Python)` check — that is how #954
  # and #956 both died, and merging both would have failed too (4.37.6 vs
  # 4.37.3).
  #
  # The mechanism is TEMPORAL DRIFT between two branches, not one-run
  # divergence. Both PRs were opened on 2026-08-01 targeting the SAME 4.37.3 —
  # their branch names still say so (`.../codeql-action/init-4.37.3` and
  # `.../analyze-4.37.3`) — and #954 then rebased itself forward to 4.37.6 nine
  # days later while #956 stood still. A group PR has ONE head branch, so it
  # cannot rebase its members apart: the pair stays matched. And if a skew ever
  # does arrive, it arrives as one red PR whose combined state CI evaluates
  # before merge, rather than two individually-green PRs that only break
  # `develop` once both land. Carving majors out here would re-open the split
  # at the next major.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns: ["*"]

  # Composite actions under .github/actions/**.
  #
  # The github-actions ecosystem is DIRECTORY-scoped, not repo-wide: with
  # `directory: "/"` Dependabot scans /.github/workflows plus a root-level
  # action.yml, and never recurses into .github/actions/**. The proof is
  # empirical — .github/actions/setup-python-env/action.yml sat on
  # actions/setup-python v6.2.0 while all seven workflow call sites had moved to
  # v7.0.0, and zero Dependabot PRs had ever targeted that file, even though the
  # composite feeds ci.yml's static / test-shard / serial-canaries jobs behind
  # the required `test (Python 3.12)` gate.
  #
  # A second entry aimed at the composite's own directory closes the gap. The
  # tempting alternative is to collapse BOTH into one entry using the plural
  # key, `directories: ["/", "/.github/actions/*"]`. That is rejected because a
  # multi-directory entry opens one PR per directory unless it also sets
  # `group-by: dependency-name` — and on THAT combined entry, grouping by
  # dependency would split `codeql-action/init` from `.../analyze`, recreating
  # the exact failure this config exists to prevent. (The objection is to the
  # combined form only; `/.github/actions/*` is a fine path in itself and is
  # used in production elsewhere. dependabot-core#10884 reports duplicate PRs
  # for a `directories:` glob that also matches .github/workflows, which a
  # composite-only path does not.)
  #
  # Note this entry has its own PR budget, so github-actions can produce up to
  # two group PRs a month, one per entry. A non-root `directory:` scans that
  # directory for any *.yml/*.yaml (dependabot-core github_actions
  # file_fetcher.rb, MANIFEST_FILE_PATTERN `/\.ya?ml$/`), so renaming this file
  # to action.yaml would stay covered — but the scan does NOT recurse, so a
  # second composite under another .github/actions/** path needs its own entry
  # here.
  - package-ecosystem: github-actions
    directory: "/.github/actions/setup-python-env"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      github-actions-composite:
        patterns: ["*"]
